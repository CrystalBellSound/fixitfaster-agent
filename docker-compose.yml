# Usage: Copy .env.example to .env.local, then add your API key and APP key.
# Run `npm run up:full` to start all services.
# Restart after changes: `npm run agent:restart`
#
# Demo containers by scenario:
#   - fixitfaster-trace-demo: Sends APM traces (every 5 seconds)
#   - fixitfaster-log-demo: Outputs logs with timezone information (every 5 seconds)
#   - fixitfaster-correlation-demo: Trace–Log correlation demo (every 5 seconds)
#   - fixitfaster-metrics-demo: Sends custom DogStatsD metrics (every 5 seconds)
#   - fixitfaster-ad-demo-nginx: Autodiscovery scenario (nginx check via conf.d/nginx.d/autoconf.yaml)
#   - fixitfaster-infra-demo: Infrastructure log simulator — container exclusion scenario (scenario-missing-container-metrics-logs-exclusion)

services:
  agent:
    image: datadog/agent:7
    container_name: fixitfaster-agent
    hostname: broken-agent
    environment:
      - DD_SITE=${DATADOG_SITE:-datadoghq.com}
      - DD_HOSTNAME=broken-agent

      # APM (traces)
      - DD_APM_ENABLED=true
      - DD_APM_NON_LOCAL_TRAFFIC=true

      # Logs
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_INCLUDE=*
      - DD_CONTAINER_EXCLUDE=name:fixitfaster-agent

      # DogStatsD (custom metrics)
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true

      # Other
      - DD_PROCESS_AGENT_ENABLED=false
      - DD_CONTAINER_EXCLUDE_LOGS=name:fixitfaster-infra-demo
      - DD_CONTAINER_EXCLUDE_METRICS=name:fixitfaster-infra-demo

    ports:
      - "8126:8126"        # APM trace intake
      - "8125:8125/udp"   # DogStatsD

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf.d/nginx.d/autoconf.yaml:/etc/datadog-agent/conf.d/nginx.d/autoconf.yaml:ro
    restart: unless-stopped

  # APM traces: send spans to the Agent (8126) every 5 seconds
  trace-demo:
    build: ./trace-demo
    container_name: fixitfaster-trace-demo
    environment:
      - DD_ENV=development
    depends_on:
      - agent
    restart: unless-stopped

  # Log timezone parsing: output logs with Asia/Seoul timestamps
  log-demo:
    build: ./log-demo
    container_name: fixitfaster-log-demo
    environment:
      - LOG_TIMEZONE=Asia/Seoul
    labels:
      com.datadoghq.ad.logs: '[{"source": "log-demo", "service": "log-demo"}]'
    restart: unless-stopped

  # Trace–Log correlation: inject trace_id into both traces and logs
  correlation-demo:
    build: ./correlation-demo
    container_name: fixitfaster-correlation-demo
    environment:
      - DD_ENV=development
      - DD_LOGS_INJECTION=false
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "correlation-demo"}]'
    depends_on:
      - agent
    restart: unless-stopped

  # Custom metrics: send metrics via DogStatsD
  metrics-demo:
    build: ./metrics-demo
    container_name: fixitfaster-metrics-demo
    environment:
      - DD_ENV=development
    depends_on:
      - agent
    restart: unless-stopped

  # Infrastructure log simulator: periodic service health logs for container exclusion scenario
  infra-demo:
    build: ./infra-demo
    container_name: fixitfaster-infra-demo
    labels:
      com.datadoghq.ad.logs: '[{"source": "infra-demo", "service": "infra-demo"}]'
    restart: unless-stopped

  # Autodiscovery scenario: nginx container; Agent runs nginx check via mounted conf (ad_identifiers)
  ad-demo-nginx:
    image: nginx:alpine
    container_name: fixitfaster-ad-demo-nginx
    volumes:
      - ./ad-demo-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  openmetrics-v2-app:
    build: ./openmetrics-v2-app
    container_name: fixitfaster-openmetrics-v2-app
    ports:
      - "8080:8080"
    restart: unless-stopped
